name: DCT Quality Checks

on:
  pull_request:
    paths:
      - '**/*.md'
      - '.markdownlint.json'

jobs:
  markdown-quality:
    name: Documentation Quality Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install quality tools
        run: |
          npm install -g markdownlint-cli
          npm install -g markdown-link-check
          npm install -g @mermaid-js/mermaid-cli

      # ─── Vérification 1 : Linting Markdown ───────────────────────────────
      - name: Lint Markdown files
        run: |
          markdownlint '**/*.md' \
            --ignore node_modules \
            --ignore '.github' \
            --config .markdownlint.json
        # Échoue si des violations markdownlint sont détectées.
        # Configuration dans .markdownlint.json : MD013, MD033, MD041 désactivées
        # pour éviter les faux positifs sur une DCT avec tableaux larges.

      # ─── Vérification 2 : Vérification des liens ─────────────────────────
      - name: Check internal and external links
        run: |
          find . -name '*.md' \
            -not -path './node_modules/*' \
            -not -path './.github/*' \
            | while read file; do
                markdown-link-check "$file" \
                  --config .markdown-link-check.json \
                  || exit 1
              done
        # Timeout court sur les liens externes (5s) pour ne pas bloquer la CI
        # sur des sites lents. Les liens internes sont vérifiés en mode strict.

      # ─── Vérification 3 : Rendu des blocs Mermaid ────────────────────────
      - name: Validate Mermaid diagram syntax
        run: |
          # Extraire tous les blocs mermaid des fichiers .md modifiés
          # et tenter de les rendre en SVG avec mmdc.
          # Tout échec de rendu rejette la PR.

          MERMAID_ERRORS=0
          TEMP_DIR=$(mktemp -d)

          # Trouver tous les fichiers .md modifiés dans la PR
          # (en CI, on vérifie tous les fichiers pour la robustesse)
          find . -name '*.md' -not -path './node_modules/*' | while read mdfile; do
            # Extraire les blocs ```mermaid ... ``` avec awk
            awk '/^```mermaid/,/^```/' "$mdfile" | \
            grep -v '^```' > "$TEMP_DIR/diagram_$(basename $mdfile .md).mmd" 2>/dev/null || true
            
            # Si le fichier extrait est non-vide, tenter le rendu
            if [ -s "$TEMP_DIR/diagram_$(basename $mdfile .md).mmd" ]; then
              mmdc -i "$TEMP_DIR/diagram_$(basename $mdfile .md).mmd" \
                   -o "$TEMP_DIR/output.svg" \
                   --puppeteerConfigFile .puppeteer.json 2>/dev/null || {
                echo "❌ Erreur Mermaid dans : $mdfile"
                MERMAID_ERRORS=$((MERMAID_ERRORS + 1))
              }
            fi
          done

          if [ $MERMAID_ERRORS -gt 0 ]; then
            echo "❌ $MERMAID_ERRORS bloc(s) Mermaid invalide(s) détecté(s)."
            exit 1
          fi
          echo "✅ Tous les blocs Mermaid sont valides."

  # ─── Résumé du pipeline ──────────────────────────────────────────────────
  quality-summary:
    name: Quality Gate Summary
    needs: markdown-quality
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Report quality gate status
        run: |
          if [ "${{ needs.markdown-quality.result }}" == "success" ]; then
            echo "✅ Documentation Quality Gate : PASSED"
            echo "   - Markdown lint : OK"
            echo "   - Links check : OK"
            echo "   - Mermaid validation : OK"
          else
            echo "❌ Documentation Quality Gate : FAILED"
            echo "Veuillez corriger les erreurs avant de merger."
            exit 1
          fi
